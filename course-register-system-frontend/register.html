<html>
    <head>
        <title>Register a Course</title>
        <style>
            body {
                background-color: black;
                text-align: center; 
            }

            form {
                margin:  auto;
                padding: 20px;
                width: 400px; 
                background-color: #fff;
            }

            input, select, button {
                width: 90%;
                padding: 10px;
                margin: 10px;
            }

            button {
                background-color: #4CAF50;
                color: white; 
                font-weight: bold;
                font-size: medium;
                cursor: pointer; 
            }

            button:hover {
                background-color: #104212; 
            }
        
        </style>
    </head>
    <body>
        <h2>Choose a course to start a Carrier</h2>

        <form action="http://localhost:8080/courses/register" method="post">
            <label for="name">Enter your Name</label><br>
            <input type="text" name="name"><br><br>

            <label for="email">Enter your EmailId</label><br>
            <input type="email" name="email"><br><br>

            <label for="coursename">Choose a Course</label><br>
            <select id="course" name="coursename">
                <option value="java essentials">Java Essentials</option>
                <option value="python for ml">Python for ML</option>
                <option value="springboot">SpringBoot</option>
                <option value="DSA using java">DSA using JAVA</option>
            </select><br><br>

            <button type="submit">Submit</button>
        </form>
    </body>
</html>
